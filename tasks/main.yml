---
- name: Validate OpenHands configuration
  ansible.builtin.assert:
    that:
      - openhands_node_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
      - openhands_uv_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
      - openhands_agent_canvas_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
      - openhands_node_checksum_x86_64 is match('^[0-9a-f]{64}$')
      - openhands_node_checksum_aarch64 is match('^[0-9a-f]{64}$')
      - openhands_uv_checksum_x86_64 is match('^[0-9a-f]{64}$')
      - openhands_uv_checksum_aarch64 is match('^[0-9a-f]{64}$')
      - openhands_agent_canvas_checksum is match('^[0-9a-f]{128}$')
      - openhands_service_user is match('^[a-z_][a-z0-9_-]*[$]?$')
      - openhands_service_group is match('^[a-z_][a-z0-9_-]*[$]?$')
      - openhands_docker_group is match('^[a-z_][a-z0-9_-]*[$]?$')
      - openhands_docker_executable | length > 0
      - openhands_bind_host | length > 0
      - openhands_bind_host is not search('\s')
      - openhands_port | int > 0
      - openhands_port | int < 65536
      - not openhands_public or openhands_backend_api_key | length >= 32
      - openhands_bind_host in ['127.0.0.1', 'localhost', '::1'] or openhands_public
      - openhands_data_dir is match('^/')
      - openhands_data_dir != '/'
      - openhands_workspace_dir is match('^/')
      - openhands_workspace_dir != '/'
      - openhands_conversation_image is match('^ghcr\.io/openhands/agent-server:[^@/:\s]+-golang$')
      - "'@' not in openhands_conversation_image"
      - >-
          openhands_conversation_image_digest == '' or
          openhands_conversation_image_digest is match('^sha256:[0-9a-f]{64}$')
      - openhands_conversation_memory is match('^[1-9][0-9]*[kmgt]i?$')
      - openhands_conversation_cpus is match('^[0-9]+([.][0-9]+)?$')
      - openhands_conversation_cpus | float > 0
      - openhands_conversation_pids_limit | int > 0
      - openhands_conversation_startup_timeout | int > 0
      - openhands_conversation_idle_ttl_seconds | int >= 0
      - (openhands_extra_environment.keys() | intersect([
          'LOCAL_BACKEND_API_KEY',
          'OH_BIND_HOST',
          'OH_CONVERSATION_CONTAINER_CPUS',
          'OH_CONVERSATION_CONTAINER_MEMORY',
          'OH_CONVERSATION_CONTAINER_PIDS_LIMIT',
          'OH_CONVERSATION_CONTAINER_STARTUP_TIMEOUT',
          'OH_CONVERSATION_IDLE_TTL_SECONDS',
          'OH_CONVERSATION_IMAGE',
          'OH_CONVERSATION_RUNTIME',
          'OH_CONVERSATION_RUNTIME_SELECTABLE',
          'OH_SECRET_KEY',
          'PORT'
        ]) | list | length) == 0
    fail_msg: >-
      OpenHands configuration is invalid. Check versions, absolute paths,
      listener settings, public-mode authentication, image and digest syntax,
      resource limits, environment variable names, and reserved variables.

- name: Validate extra environment variable names
  ansible.builtin.assert:
    that:
      - item.key is match('^[A-Za-z_][A-Za-z0-9_]*$')
    fail_msg: "Invalid environment variable name: {{ item.key }}"
  loop: "{{ openhands_extra_environment | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Validate the prerequisite platform
  ansible.builtin.assert:
    that:
      - ansible_facts['system'] == 'Linux'
      - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    fail_msg: >-
      OpenHands prerequisites support Linux x86_64 and aarch64 only; got
      {{ ansible_facts['system'] | default('unknown') }} /
      {{ ansible_facts['architecture'] | default('unknown') }}.
  when: openhands_install_prerequisites

- name: Check Docker executable
  ansible.builtin.command:
    argv:
      - "{{ openhands_docker_executable }}"
      - --version
  register: openhands_docker_version_check
  changed_when: false
  check_mode: false
  when: openhands_docker_preflight_enabled
  failed_when: openhands_docker_version_check.rc != 0

- name: Check Docker daemon reachability
  ansible.builtin.command:
    argv:
      - "{{ openhands_docker_executable }}"
      - info
  register: openhands_docker_info_check
  changed_when: false
  check_mode: false
  when: openhands_docker_preflight_enabled
  failed_when: openhands_docker_info_check.rc != 0

- name: Create the OpenHands service group
  ansible.builtin.group:
    name: "{{ openhands_service_group }}"
    system: true
    state: present
  when: openhands_manage_service_identity

- name: Create the OpenHands service user
  ansible.builtin.user:
    name: "{{ openhands_service_user }}"
    group: "{{ openhands_service_group }}"
    groups:
      - "{{ openhands_docker_group }}"
    append: true
    home: "{{ openhands_data_dir }}"
    shell: /usr/sbin/nologin
    create_home: false
    system: true
    state: present
  when: openhands_manage_service_identity

- name: Create the OpenHands data directory
  ansible.builtin.file:
    path: "{{ openhands_data_dir }}"
    state: directory
    owner: "{{ openhands_service_user }}"
    group: "{{ openhands_service_group }}"
    mode: "0750"

- name: Create the OpenHands workspace parent directory
  ansible.builtin.file:
    path: "{{ openhands_workspace_dir | dirname }}"
    state: directory
    owner: "{{ openhands_service_user }}"
    group: "{{ openhands_service_group }}"
    mode: "0750"
  when: (openhands_workspace_dir | dirname) != '/'

- name: Create the OpenHands workspace directory
  ansible.builtin.file:
    path: "{{ openhands_workspace_dir }}"
    state: directory
    owner: "{{ openhands_service_user }}"
    group: "{{ openhands_service_group }}"
    mode: "0750"

- name: Install managed application prerequisites
  ansible.builtin.include_tasks: prerequisites.yml
  when: openhands_install_prerequisites

- name: Manage the OpenHands systemd service
  ansible.builtin.include_tasks: service.yml
  when: openhands_manage_service
