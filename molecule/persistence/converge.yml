---
- name: Converge the OpenHands persistence role
  hosts: all
  become: true
  gather_facts: true
  vars:
    persistence_checksum_mode: >-
      {{
        lookup('ansible.builtin.env', 'OPENHANDS_CHECKSUM_MODE')
        | default('version-only', true)
      }}
    persistence_prerequisite_checksums:
      node_x86_64: 58a5ff5cc8f2200e458bea22e329d5c1994aa1b111d499ca46ec2411d58239ca
      node_aarch64: 0dc93ec5c798b0d347f068db6d205d03dea9a71765e6a53922b682b91265d71f
      uv_x86_64: 8b3762374972daa7a74bbc6896cc73229ca69a07403dd9f9ea3805a51ffd7582
      uv_aarch64: 6aadf3c71600d594e16dabf382cc15282ead4c5ca768599b6bcb43c5004d9aa8
      agent_canvas: >-
        {{
          '5830de4ec20a8d0da93e3b294e2940824b045034fba6c719692688bbdf9b5d74'
          ~ '3279896f8a486999001300320ba05a917d204f36e4213999d5f02b974b690788'
        }}
    openhands_node_checksum_x86_64: >-
      {{
        persistence_prerequisite_checksums['node_x86_64']
        if persistence_checksum_mode == 'verified'
        else ''
      }}
    openhands_node_checksum_aarch64: >-
      {{
        persistence_prerequisite_checksums['node_aarch64']
        if persistence_checksum_mode == 'verified'
        else ''
      }}
    openhands_uv_checksum_x86_64: >-
      {{
        persistence_prerequisite_checksums['uv_x86_64']
        if persistence_checksum_mode == 'verified'
        else ''
      }}
    openhands_uv_checksum_aarch64: >-
      {{
        persistence_prerequisite_checksums['uv_aarch64']
        if persistence_checksum_mode == 'verified'
        else ''
      }}
    openhands_agent_canvas_checksum: >-
      {{
        persistence_prerequisite_checksums['agent_canvas']
        if persistence_checksum_mode == 'verified'
        else ''
      }}
    persistence_effective_checksums:
      - "{{ openhands_node_checksum_x86_64 }}"
      - "{{ openhands_node_checksum_aarch64 }}"
      - "{{ openhands_uv_checksum_x86_64 }}"
      - "{{ openhands_uv_checksum_aarch64 }}"
      - "{{ openhands_agent_canvas_checksum }}"
    openhands_backend_api_key: ci-only-openhands-backend-key-0001
    openhands_extra_environment:
      AUTOMATION_LOG_LEVEL: DEBUG
      LOG_LEVEL: DEBUG
  pre_tasks:
    - name: Validate the persistence checksum mode
      ansible.builtin.assert:
        that:
          - persistence_checksum_mode in ['version-only', 'verified']
          - >-
              persistence_checksum_mode != 'version-only' or
              persistence_effective_checksums | reject('equalto', '') | list | length == 0
          - >-
              persistence_checksum_mode != 'verified' or
              persistence_effective_checksums | select('equalto', '') | list | length == 0
        fail_msg: >-
          OPENHANDS_CHECKSUM_MODE must be either version-only or verified, and
          it must select the corresponding empty or populated checksum set.
      tags:
        - persistence-checksum-mode
  roles:
    - role: nietaki.openhands
