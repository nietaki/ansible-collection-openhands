---
- name: Install the OpenHands runtime log capture script
  ansible.builtin.copy:
    src: capture-runtime-logs.sh
    dest: "{{ openhands_data_dir }}/capture-runtime-logs.sh"
    owner: "{{ openhands_service_user }}"
    group: "{{ openhands_service_group }}"
    mode: "0750"

- name: Install the OpenHands runtime log capture systemd unit
  ansible.builtin.template:
    src: openhands-runtime-logs.service.j2
    dest: /etc/systemd/system/openhands-runtime-logs.service
    owner: root
    group: root
    mode: "0644"
  when:
    - openhands_capture_runtime_logs
    - ansible_facts['system'] == 'Linux'

- name: Enable or disable the OpenHands runtime log capture service
  ansible.builtin.systemd_service:
    name: openhands-runtime-logs.service
    enabled: "{{ openhands_capture_runtime_logs }}"
    state: "{{ 'started' if openhands_capture_runtime_logs else 'stopped' }}"
    daemon_reload: true
  when:
    - openhands_capture_runtime_logs
    - ansible_facts['system'] == 'Linux'
