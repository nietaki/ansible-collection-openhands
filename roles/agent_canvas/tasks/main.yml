---
- name: Validate role state
  ansible.builtin.assert:
    that:
      - state in ['present', 'absent']
      - openhands_remove_containers is boolean
    fail_msg: >-
      state must be present or absent, and openhands_remove_containers must be a boolean.

- name: Install or configure OpenHands Agent Canvas
  ansible.builtin.include_tasks: present.yml
  when: state == 'present'

- name: Remove OpenHands Agent Canvas
  ansible.builtin.include_tasks: absent.yml
  when: state == 'absent'
