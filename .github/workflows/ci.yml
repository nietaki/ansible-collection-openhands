name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: 0.11.8

jobs:
  quality:
    name: Quality and contract tests
    runs-on: ubuntu-26.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        run: python3 -m pip install --user "uv==${UV_VERSION}"

      - name: Add the user install directory to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install locked development dependencies
        run: uv sync --locked

      - name: Run YAML lint
        run: uv run yamllint .

      - name: Run Ansible lint
        run: uv run ansible-lint

      - name: Check example playbook syntax
        run: uv run ansible-playbook --syntax-check -i localhost, -c local tests/fixtures/syntax.yml

      - name: Run contract tests
        run: uv run python -m unittest discover -s tests -p 'test_*.py'

      - name: Run the delegated Molecule scenario
        run: uv run molecule test -s default

  ansible-compatibility:
    name: Ansible ${{ matrix.label }} (${{ matrix.version }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: minimum
            version: "2.20.0"
            requirement: "ansible-core==2.20.0"
          - label: latest
            version: latest
            requirement: ansible-core
          - label: kotik
            version: "2.22.0"
            requirement: "ansible-core==2.22.0"
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        run: python3 -m pip install --user "uv==${UV_VERSION}"

      - name: Add the user install directory to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install locked development dependencies
        run: uv sync --locked

      - name: Check Ansible version compatibility
        run: >-
          uv run --isolated --with "${{ matrix.requirement }}"
          ansible-playbook --version

      - name: Check example playbook syntax
        run: >-
          uv run --isolated --with "${{ matrix.requirement }}"
          ansible-playbook --syntax-check -i localhost, -c local tests/fixtures/syntax.yml

      - name: Run the delegated Molecule scenario
        run: >-
          uv run --isolated --with "${{ matrix.requirement }}"
          --with "molecule==25.11.1"
          --with "molecule-plugins==26.11.0"
          molecule test -s default

  native-integration:
    name: Native ${{ matrix.architecture }} integration
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-26.04
          - architecture: arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        run: python3 -m pip install --user "uv==${UV_VERSION}"

      - name: Add the user install directory to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install locked development dependencies
        run: uv sync --locked

      - name: Run the no-op role scenario
        run: uv run molecule test -s default

      - name: Run the official image contract smoke test
        run: uv run python -m unittest tests.contract.test_official_image
