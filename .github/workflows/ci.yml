name: CI

on:
  pull_request:
  push:
    branches:
      - '**'
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: 0.11.8
  ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections

jobs:
  quality:
    name: Quality and contract tests
    runs-on: ubuntu-26.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        run: python3 -m pip install --user "uv==${UV_VERSION}"

      - name: Add the user install directory to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install locked development dependencies
        run: uv sync --locked

      - name: Run the workstation-safe validation suite
        run: make check

  ansible-compatibility:
    name: Ansible ${{ matrix.label }} (${{ matrix.version }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: minimum
            version: "2.20.0"
            requirement: "ansible-core==2.20.0"
          - label: latest
            version: latest
            requirement: ansible-core
          - label: kotik
            version: "2.22.0"
            requirement: "ansible-core==2.22.0"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        run: python3 -m pip install --user "uv==${UV_VERSION}"

      - name: Add the user install directory to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install locked development dependencies
        run: uv sync --locked

      - name: Run Ansible compatibility validation
        env:
          ANSIBLE_REQUIREMENT: ${{ matrix.requirement }}
        run: make check-compatibility

  native-integration:
    name: Native ${{ matrix.architecture }} ${{ matrix.checksum_mode }} integration
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            checksum_mode: version-only
            runner: ubuntu-26.04
          - architecture: amd64
            checksum_mode: verified
            runner: ubuntu-26.04
          - architecture: arm64
            checksum_mode: version-only
            runner: ubuntu-26.04-arm
          - architecture: arm64
            checksum_mode: verified
            runner: ubuntu-26.04-arm
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        run: python3 -m pip install --user "uv==${UV_VERSION}"

      - name: Add the user install directory to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install locked development dependencies
        run: uv sync --locked

      - name: Run native integration validation
        run: make check-native-${{ matrix.checksum_mode }}

      - name: Display the OpenHands journal after failure
        if: failure()
        run: sudo journalctl --unit=openhands.service --boot=0 --no-pager --lines=200 || true

      - name: Upload OpenHands integration diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: >-
            ${{
              format(
                'openhands-diagnostics-{0}-{1}-attempt-{2}',
                matrix.architecture,
                matrix.checksum_mode,
                github.run_attempt
              )
            }}
          path: /tmp/openhands-ci-diagnostics/
          if-no-files-found: warn
          retention-days: 7

  release-eligibility:
    name: Classify release tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      should_publish: ${{ steps.classify.outputs.should_publish }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify and validate release tag
        id: classify
        run: |
          tag="$GITHUB_REF_NAME"
          if ! printf '%s\n' "$tag" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Tag '$tag' is not a plain X.Y.Z release tag; publication skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          version=$(awk '$1 == "version:" { print $2 }' galaxy.yml | tr -d '"')
          if [ "$tag" != "$version" ]; then
            echo "Tag '$tag' does not match galaxy.yml version '$version'" >&2
            exit 1
          fi

          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/master; then
            echo "Tagged commit is not reachable from origin/master" >&2
            exit 1
          fi

          echo "should_publish=true" >> "$GITHUB_OUTPUT"

  publish-galaxy:
    name: Publish collection to Ansible Galaxy
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') &&
      needs.release-eligibility.outputs.should_publish == 'true'
    needs:
      - quality
      - ansible-compatibility
      - native-integration
      - release-eligibility
    runs-on: ubuntu-26.04
    environment:
      name: galaxy-publish
    permissions:
      contents: read
    steps:
      - name: Check out the tagged release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release tag and version
        run: |
          tag="$GITHUB_REF_NAME"
          if ! printf '%s\n' "$tag" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Tag '$tag' is not a plain MAJOR.MINOR.PATCH version" >&2
            exit 1
          fi

          version=$(awk '$1 == "version:" { gsub(/"/, "", $2); print $2 }' galaxy.yml)
          if [ "$tag" != "$version" ]; then
            echo "Tag '$tag' does not match galaxy.yml version '$version'" >&2
            exit 1
          fi

          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/master; then
            echo "Tagged commit is not reachable from origin/master" >&2
            exit 1
          fi

      - name: Install uv
        run: python3 -m pip install --user "uv==${UV_VERSION}"

      - name: Add the user install directory to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install locked development dependencies
        run: uv sync --locked

      - name: Build the collection artifact
        run: make collection-install

      - name: Publish the collection
        env:
          ANSIBLE_GALAXY_API_KEY: ${{ secrets.ANSIBLE_GALAXY_API_KEY }}
        run: |
          if [ -z "$ANSIBLE_GALAXY_API_KEY" ]; then
            echo 'ANSIBLE_GALAXY_API_KEY is not configured in the galaxy-publish environment' >&2
            exit 1
          fi

          version=$(awk '$1 == "version:" { gsub(/"/, "", $2); print $2 }' galaxy.yml)
          artifact=".ansible/collection-build/nietaki-openhands-${version}.tar.gz"
          test -f "$artifact"

          config="$RUNNER_TEMP/ansible-galaxy.cfg"
          umask 077
          printf '%s\n' \
            '[galaxy]' \
            'server_list = release_galaxy' \
            '' \
            '[galaxy_server.release_galaxy]' \
            'url = https://galaxy.ansible.com/' \
            "token = $ANSIBLE_GALAXY_API_KEY" > "$config"
          trap 'rm -f "$config"' EXIT
          ANSIBLE_CONFIG="$config" uv run ansible-galaxy collection publish \
            "$artifact" --server release_galaxy
